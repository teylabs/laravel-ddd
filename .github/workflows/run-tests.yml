name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    # chore/framework-compatibility is a stacked base: pull requests targeting it
    # are real changes that need the full matrix, and without it listed here they
    # would merge upward having never run these tests.
    branches: [main, next, develop, develop-internals, chore/framework-compatibility]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.4, 8.3]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-lowest, prefer-stable]
        include:
            -   laravel: 13.*
                testbench: "11.*"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   laravel: 12.*
                testbench: "10.*"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"
            -   laravel: 11.*
                testbench: "^9.11"
                carbon: "^3.8.4"
                pest: "^4.0"
                pest-plugin: "^4.0"

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        shell: bash
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix['pest-plugin'] }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Report resolved versions
        # The matrix label is not evidence of what installed: "11.*" can resolve
        # to 11.x-dev, and prefer-lowest routinely lands above the declared
        # floor. Record the resolved set where it is actually readable.
        shell: bash
        run: bash .github/scripts/report-resolved-versions.sh "P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}"

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage
