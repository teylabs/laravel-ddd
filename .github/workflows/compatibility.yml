name: compatibility

# Fresh dependency resolution on a schedule, because run-tests.yml only fires on
# pushes to main and on pull requests: a Laravel release while this repository is
# quiet never triggers a new resolution on its own.
#
# Every job resolves from scratch (no lock file is committed) and reports the
# versions it actually ended up with. The matrix label is not evidence of what
# installed — see the "report resolved versions" step in each job.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  # workflow_dispatch only becomes available once the workflow is on the default
  # branch, so a schedule/manual-only workflow cannot be exercised before it is
  # merged. This path filter makes the workflow run on pull requests that touch
  # the workflow itself or the scripts it calls, and nothing else — ordinary
  # code pull requests are unaffected and keep using run-tests.yml alone.
  pull_request:
    paths:
      - '.github/workflows/compatibility.yml'
      - '.github/scripts/report-resolved-versions.sh'
      - '.github/scripts/floor-smoke.php'

permissions:
  contents: read

jobs:
  released:
    # Released-version coverage. composer.json sets minimum-stability:dev, and
    # --prefer-stable only *prefers* stable, so it will still take a dev branch
    # when no release satisfies the constraint. This job pins stability to
    # stable so a dev branch cannot be silently reported as released coverage.
    #
    # That makes the job honest rather than green: Laravel 11 currently has no
    # installable release at all (every v11.0.0-v11.56.1 is blocked by security
    # advisories), so its install step fails and is reported as unavailable
    # released coverage instead of quietly resolving 11.x-dev.
    name: released - L${{ matrix.laravel }} - P${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['13.*', '12.*', '11.*']
        include:
          - laravel: '13.*'
            testbench: '11.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '11.*'
            testbench: '^9.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install released dependencies
        id: install
        continue-on-error: true
        run: |
          composer config minimum-stability stable
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:^3.8.4" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Report unavailable released coverage
        if: steps.install.outcome != 'success'
        run: |
          {
            echo "### released - L${{ matrix.laravel }} - P${{ matrix.php }}"
            echo
            echo "> **No released coverage.** No released \`laravel/framework:${{ matrix.laravel }}\` could be installed with stability pinned to stable."
            echo "> This is reported as a failure rather than falling back to a dev branch, which would not be released coverage."
            echo "> A security advisory blocking every release of a supported major is the expected cause; check the install step log."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::No released laravel/framework ${{ matrix.laravel }} could be installed; released coverage is unavailable for this major"
          exit 1

      - name: Report resolved versions
        run: bash .github/scripts/report-resolved-versions.sh "released - L${{ matrix.laravel }} - P${{ matrix.php }}"

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage

  lowest-installable:
    # Deliberately NOT a floor job. --prefer-lowest does not reach this package's
    # declared floors, because the dev toolchain constrains the graph above them
    # (pestphp/pest-plugin-laravel requires laravel/framework
    # ^11.45.2|^12.52.0|^13.0). The declared floors themselves are checked by the
    # floor-smoke job below, which is what a consumer install actually looks like.
    name: lowest installable - L${{ matrix.laravel }} - P${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        laravel: ['13.*', '12.*', '11.*']
        include:
          - laravel: '13.*'
            testbench: '11.*'
            declared-floor: '13.0.0'
          - laravel: '12.*'
            testbench: '10.*'
            declared-floor: '12.0.0'
          - laravel: '11.*'
            testbench: '^9.11'
            declared-floor: '11.44.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:^3.8.4" "pestphp/pest:^4.0" "pestphp/pest-plugin-laravel:^4.0" --no-interaction --no-update
          composer update --prefer-lowest --prefer-dist --no-interaction

      - name: Report resolved versions
        run: bash .github/scripts/report-resolved-versions.sh "lowest installable - L${{ matrix.laravel }} - P${{ matrix.php }}" "${{ matrix['declared-floor'] }}"

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage

  floor-smoke:
    # The declared floors are checked the way a consumer meets them: with
    # --no-dev, so the dev toolchain (which cannot install them) is out of the
    # picture.
    #
    # The version is pinned to an EXACT release, not a patch wildcard. A range
    # like 11.44.* can resolve a later patch, and with minimum-stability:dev it
    # can resolve a branch alias — either of which would let this job report
    # success under the declared floor's name while testing something else. The
    # smoke script re-checks the installed version before it does anything.
    #
    # This job is expected to go red while a floor release is uninstallable. That
    # is a real coverage gap and it is meant to be visible, not smoothed over.
    name: floor smoke - laravel/framework ${{ matrix.floor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - floor: '11.44.0'
            php: '8.3'
          - floor: '12.0.0'
            php: '8.3'
          - floor: '13.0.0'
            php: '8.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Build a consumer-shaped install at the declared floor
        id: install
        continue-on-error: true
        # Built with the composer CLI rather than a heredoc so the workspace path
        # is absolute and the step does not depend on the checkout directory name.
        #
        # minimum-stability:dev is required for the path repository (the package
        # itself only has a dev-<branch> version there). It does NOT loosen the
        # framework, which is pinned to an exact release below.
        #
        # Security policy is left at its defaults. Disabling advisory blocking to
        # make this job green would be reporting a floor that a consumer cannot
        # actually install.
        run: |
          mkdir -p "${RUNNER_TEMP}/floor-consumer"
          cd "${RUNNER_TEMP}/floor-consumer"
          printf '{}' > composer.json
          composer config name smoke/floor-consumer
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.package "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"
          composer require "tey/laravel-ddd:*@dev" "laravel/framework:${{ matrix.floor }}" --no-interaction --no-update
          composer update --no-dev --prefer-dist --no-interaction

      - name: Report an unavailable floor and fail
        if: steps.install.outcome != 'success'
        # Deliberately states no cause. A security advisory is one possibility,
        # but so are a solver conflict, a packagist outage and a mistake in this
        # workflow — and asserting the wrong one teaches people to dismiss the
        # job. The install log has the actual composer error.
        run: |
          {
            echo "### floor smoke - laravel/framework ${{ matrix.floor }}"
            echo
            echo "> **Floor not verified.** \`laravel/framework:${{ matrix.floor }}\` could not be installed for a consumer-shaped (\`--no-dev\`) project, so nothing was smoked against the declared floor."
            echo "> The cause is whatever the install step reported — read it before concluding anything. A release blocked by a security advisory, a solver conflict and a transient network failure all land here."
            echo "> This is a coverage gap, not evidence either way about whether the package works at its floor."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::laravel/framework ${{ matrix.floor }} could not be installed; the declared floor was not verified in this run"
          exit 1

      - name: Verify the package loads against the floor
        if: steps.install.outcome == 'success'
        # The expected version is passed so the script can refuse to smoke
        # anything that is not the exact declared floor.
        run: php .github/scripts/floor-smoke.php "${RUNNER_TEMP}/floor-consumer/vendor/autoload.php" "${{ matrix.floor }}"

      - name: Report floor result
        if: steps.install.outcome == 'success'
        run: |
          cd "${RUNNER_TEMP}/floor-consumer"
          bash "${GITHUB_WORKSPACE}/.github/scripts/report-resolved-versions.sh" "floor smoke - ${{ matrix.floor }}"

  dev-canary:
    # Non-blocking: a failure here means the NEXT Laravel major is drifting away
    # from this package. Worth seeing early, never a gate.
    #
    # continue-on-error is set per step rather than on the job. A job-level
    # continue-on-error still reports `needs.dev-canary.result` as 'success' to
    # dependent jobs, which would hide a real failure behind a green summary
    # row. Step outcomes are published as job outputs so the summary can state
    # what actually happened.
    name: dev canary - laravel/framework dev-master
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.install.outcome }}
      tests: ${{ steps.tests.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # dev-master pulls symfony/console ^8.1, which requires php >= 8.4.1,
          # so the canary cannot resolve on 8.3.
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          composer require "laravel/framework:dev-master" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Report resolved versions
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/report-resolved-versions.sh "dev canary - dev-master"

      - name: Execute tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: vendor/bin/pest --ci --no-coverage

      - name: Report canary outcome
        run: |
          install_outcome="${{ steps.install.outcome }}"
          tests_outcome="${{ steps.tests.outcome }}"
          {
            echo "### dev canary - laravel/framework dev-master"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| install | ${install_outcome} |"
            echo "| tests | ${tests_outcome:-skipped} |"
            echo
            echo "> Non-blocking. This tracks the next Laravel major and is not released-version coverage."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$install_outcome" != 'success' ]; then
            echo "::warning::dev canary could not install laravel/framework dev-master"
          elif [ "$tests_outcome" != 'success' ]; then
            echo "::warning::dev canary tests FAILED against laravel/framework dev-master"
          fi

  report:
    name: compatibility summary
    runs-on: ubuntu-latest
    needs: [released, lowest-installable, floor-smoke, dev-canary]
    if: always()

    steps:
      - name: Summarize outcomes
        run: |
          # dev-canary's job result is not a useful signal: its steps are
          # continue-on-error, so the job succeeds regardless. Read the published
          # step outcomes instead.
          canary_install="${{ needs.dev-canary.outputs.install }}"
          canary_tests="${{ needs.dev-canary.outputs.tests }}"

          if [ "$canary_install" != 'success' ]; then
            canary="install failed"
          elif [ "$canary_tests" = 'success' ]; then
            canary="passed"
          else
            canary="tests ${canary_tests:-did not run}"
          fi

          {
            echo "## Compatibility run"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| released | ${{ needs.released.result }} |"
            echo "| lowest installable | ${{ needs.lowest-installable.result }} |"
            echo "| floor smoke | ${{ needs.floor-smoke.result }} |"
            echo "| dev canary (non-blocking) | ${canary} |"
            echo
            echo "Per-job resolved PHP / framework / Testbench versions are in each job's summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if released-version coverage regressed
        # The dev canary is excluded on purpose: it is allowed to be red.
        if: needs.released.result != 'success' || needs.lowest-installable.result != 'success' || needs.floor-smoke.result != 'success'
        run: |
          echo "::error::Compatibility testing against released Laravel versions failed. See the resolved-version report in the failing job."
          exit 1
